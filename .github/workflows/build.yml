name: build

on:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('build.sh') }}
      - name: Tests
        run: bash build.sh test
      - name: Build APK
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RadarForge-Android-apk
          path: build/RadarForge-Android-*.apk
